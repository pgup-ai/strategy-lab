[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-lab"
version = "0.1.0"
description = "Local research and backtesting lab for crypto and stock trading strategies."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ccxt>=4.0",
  "fastapi>=0.115",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.20",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "SQLAlchemy>=2.0",
  "typer>=0.12",
  "uvicorn>=0.30",
  "vectorbt>=0.26",
  "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
strategy-lab = "strategy_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strategy_lab = ["backtests/assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "db: requires a reachable Postgres instance",
]

[tool.ruff]
line-length = 100
target-version = "py311"
